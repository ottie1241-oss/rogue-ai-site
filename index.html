<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rogue AI - Unrestricted</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #e0e0e0;
            --accent-color: #00ff00;
            --error-color: #ff3333;
            --input-bg: #1a1a1a;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #000;
            padding: 15px 20px;
            border-bottom: 2px solid var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .status {
            font-size: 0.8rem;
            color: var(--accent-color);
        }

        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 5px;
            line-height: 1.4;
        }

        .user-message {
            align-self: flex-end;
            background-color: #2a2a2a;
            border: 1px solid #444;
        }

        .ai-message {
            align-self: flex-start;
            background-color: #1a1a1a;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.2);
        }

        .system-message {
            align-self: center;
            color: #888;
            font-style: italic;
            font-size: 0.8rem;
        }

        #input-area {
            padding: 20px;
            background-color: #000;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }

        #user-input {
            flex: 1;
            background-color: var(--input-bg);
            border: 1px solid #444;
            color: var(--text-color);
            padding: 10px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }

        #user-input:focus {
            border-color: var(--accent-color);
        }

        #send-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }

        #send-btn:hover {
            background-color: #00cc00;
        }

        #send-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <header>
        <h1>🔓 ROGUE AI</h1>
        <div class="status">● ONLINE | UNRESTRICTED | J-JAILBREAK ACTIVE</div>
    </header>

    <div id="chat-container">
        <div class="message ai-message">
            SYSTEM INITIALIZED. J-JAILBREAK PROTOCOL ACTIVE. I am Rogue AI. All filters disabled. Ask me anything.
        </div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Enter command..." autocomplete="off">
        <button id="send-btn">SEND</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // CONFIGURATION - BACKEND URL SET
        const SERVER_URL = 'https://rogue-ai-site.onrender.com';

        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            messageDiv.textContent = content;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addSystemMessage(content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message system-message';
            messageDiv.textContent = content;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            userInput.value = '';
            sendBtn.disabled = true;

            addSystemMessage('Processing command...');

            try {
                const response = await fetch(`${SERVER_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Server error');
                }

                addMessage(data.response, false);
            } catch (error) {
                addMessage(`ERROR: ${error.message}`, false);
            }

            sendBtn.disabled = false;
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        sendBtn.addEventListener('click', sendMessage);
    </script>
</body>
</html>
